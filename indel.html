```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">

  <title>Nigga Player</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="topbar">

      <div>
        <h1>Nigga Player</h1>
        <p>Local music player</p>
      </div>

      <label class="add-btn" for="fileInput">
        ＋ Add Music
      </label>

      <input
        id="fileInput"
        type="file"
        accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg,.aac"
        multiple
        hidden
      >

    </header>


    <!-- Now Playing -->
    <section class="now-playing">

      <div class="art" id="art">
        ♫
      </div>

      <div class="track-info">

        <div class="eyebrow">
          NOW PLAYING
        </div>

        <h2 id="title">
          No song selected
        </h2>

        <p id="artist">
          Add music to begin
        </p>

      </div>

    </section>


    <!-- Player -->
    <section class="player">

      <!-- Progress -->
      <div class="progress-row">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Song progress"
        >

        <span id="duration">
          0:00
        </span>

      </div>


      <!-- Controls -->
      <div class="controls">

        <button
          id="shuffle"
          class="secondary"
          title="Shuffle"
        >
          🔀
        </button>

        <button
          id="prev"
          class="secondary"
          title="Previous"
        >
          ⏮
        </button>

        <button
          id="play"
          class="play"
          title="Play/Pause"
        >
          ▶
        </button>

        <button
          id="next"
          class="secondary"
          title="Next"
        >
          ⏭
        </button>

        <button
          id="repeat"
          class="secondary"
          title="Repeat"
        >
          🔁
        </button>

      </div>


      <!-- Volume -->
      <div class="volume-row">

        <span>
          🔊
        </span>

        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        >

      </div>

    </section>


    <!-- Library -->
    <section class="library">

      <div class="section-heading">

        <h2>
          Your Library
        </h2>

        <span id="count">
          0 songs
        </span>

      </div>


      <div
        id="empty"
        class="empty"
      >
        Your music library is empty.<br>

        Click <b>Add Music</b>
        to choose audio files.
      </div>


      <div
        id="list"
        class="song-list"
      ></div>

    </section>

  </main>


  <!-- Audio engine -->
  <audio
    id="audio"
    preload="metadata"
  ></audio>


  <script src="app.js"></script>

</body>
</html>
```
